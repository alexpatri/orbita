# Tema escuro para os apps GTK.
#
# Motivo concreto: o Firefox usa decoração própria (CSD) e desenha a moldura da
# janela com o tema GTK. Com o Adwaita claro, essa moldura saía como uma linha
# de 2px em rgb(160,159,162) entre a borda do bspwm e o conteúdo escuro do
# navegador — lia como um vão vazio. Comparação que isolou a causa: o alacritty,
# que não usa CSD, vai da borda direto para o conteúdo.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
